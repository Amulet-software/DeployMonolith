name: MonolithDeploy CI

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n bootstrap.sh
          bash -n deploy.sh
          bash -n health-check.sh
          bash -n backup.sh
          bash -n cicd-preflight.sh
          bash -n deploy-key-setup.sh
          bash -n install-runner.sh
          bash -n deployment-status.sh

      - name: Validate contour-aware Site compatibility wiring
        run: |
          grep -Fq 'proxy_pass http://site:80;' nginx/default.conf.template
          grep -Fq 'MONOLITH_HUB_UPSTREAM: http://hub:8080' compose.yml
          grep -Fq 'VITE_MONOLITH_CONTOUR_ID: ${SITE_CONTOUR_ID:-prod}' compose.yml
          grep -Fq 'MONOLITH_CONTOUR_ID: ${SITE_CONTOUR_ID:-prod}' compose.yml
          grep -Fq 'SITE_CONTOUR_ID=dev' profiles/dev.env.example
          grep -Fq 'SITE_CONTOUR_ID=test' profiles/test.env.example
          grep -Fq 'SITE_CONTOUR_ID=prod' profiles/production.env.example

      - name: Validate DEV Compose
        run: |
          docker compose \
            --project-name monolith-dev-ci \
            --env-file profiles/dev.env.example \
            --profile dev \
            config --quiet
