name: Monolith Project Sync

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, synchronize, converted_to_draft, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      item_url:
        description: Issue or PR URL
        required: true
        type: string
      status:
        description: Project status
        required: true
        type: choice
        options: [Backlog, Ready, In progress, In review, Testing, Ready to merge, Done]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync-project:
    runs-on: ubuntu-latest
    steps:
      - name: Sync item with Monolith Development
        shell: bash
        env:
          PROJECT_TOKEN: ${{ secrets.MONOLITH_PROJECT_TOKEN }}
          PROJECT_OWNER: Amulet-software
          PROJECT_TITLE: Monolith Development
        run: |
          set -euo pipefail
          if [[ -z "${PROJECT_TOKEN:-}" ]]; then echo "::notice title=Project sync disabled::Create repository secret MONOLITH_PROJECT_TOKEN to enable GitHub Projects synchronization."; exit 0; fi
          url=""; status=""
          case "$GITHUB_EVENT_NAME" in
            issues)
              url="$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH")"; action="$(jq -r '.action' "$GITHUB_EVENT_PATH")"
              case "$action" in opened|reopened) status="Backlog" ;; closed) status="Done" ;; esac ;;
            pull_request)
              url="$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")"; action="$(jq -r '.action' "$GITHUB_EVENT_PATH")"
              case "$action" in
                opened|reopened|synchronize) [[ "$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")" == "true" ]] && status="In progress" || status="In review" ;;
                converted_to_draft) status="In progress" ;;
                ready_for_review) status="In review" ;;
                closed) status="Done" ;;
              esac ;;
            pull_request_review)
              review_state="$(jq -r '.review.state | ascii_downcase' "$GITHUB_EVENT_PATH")"
              if [[ "$review_state" == "changes_requested" ]]; then url="$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")"; status="In progress"; fi ;;
            issue_comment)
              if [[ "$(jq -r '.issue.pull_request != null' "$GITHUB_EVENT_PATH")" == "true" ]]; then
                association="$(jq -r '.comment.author_association // "NONE"' "$GITHUB_EVENT_PATH")"
                case "$association" in OWNER|MEMBER|COLLABORATOR)
                  command="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH" | tr -d '\r' | xargs)"; url="$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH")"
                  case "$command" in /tested) status="Ready to merge" ;; /test-failed) status="In progress" ;; esac ;;
                esac
              fi ;;
            workflow_dispatch) url="$(jq -r '.inputs.item_url' "$GITHUB_EVENT_PATH")"; status="$(jq -r '.inputs.status' "$GITHUB_EVENT_PATH")" ;;
          esac
          [[ -z "$url" || -z "$status" ]] && { echo "No project update required for this event."; exit 0; }
          project_number="$(GH_TOKEN="$PROJECT_TOKEN" gh project list --owner "$PROJECT_OWNER" --format json --jq ".projects[] | select(.title == \"$PROJECT_TITLE\") | .number" | head -n 1)"
          [[ -z "$project_number" ]] && { echo "::error::Project '$PROJECT_TITLE' was not found for '$PROJECT_OWNER'."; exit 1; }
          project_id="$(GH_TOKEN="$PROJECT_TOKEN" gh project view "$project_number" --owner "$PROJECT_OWNER" --format json --jq '.id')"
          item_id="$(GH_TOKEN="$PROJECT_TOKEN" gh project item-add "$project_number" --owner "$PROJECT_OWNER" --url "$url" --format json --jq '.id')"
          GH_TOKEN="$PROJECT_TOKEN" gh project item-edit "$project_number" --owner "$PROJECT_OWNER" --url "$url" --field "Status" --value "$status"
          iteration_json="$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query="query { organization(login: \"$PROJECT_OWNER\") { projectV2(number: $project_number) { fields(first: 100) { nodes { ... on ProjectV2IterationField { id name configuration { iterations { id title startDate duration } } } } } } } }")"
          iteration_field_id="$(jq -r '.data.organization.projectV2.fields.nodes[] | select(.name == "Iteration") | .id' <<<"$iteration_json" | head -n 1)"
          current_iteration_id="$(python3 -c 'import json,sys,datetime as d; x=json.load(sys.stdin); t=d.datetime.now(d.timezone.utc).date(); fs=x["data"]["organization"]["projectV2"]["fields"]["nodes"]; its=next((f["configuration"]["iterations"] for f in fs if f and f.get("name")=="Iteration"), []); print(next((i["id"] for i in its if d.date.fromisoformat(i["startDate"]) <= t < d.date.fromisoformat(i["startDate"]) + d.timedelta(days=i["duration"])), ""))' <<<"$iteration_json")"
          current_iteration_title="$(python3 -c 'import json,sys,datetime as d; x=json.load(sys.stdin); t=d.datetime.now(d.timezone.utc).date(); fs=x["data"]["organization"]["projectV2"]["fields"]["nodes"]; its=next((f["configuration"]["iterations"] for f in fs if f and f.get("name")=="Iteration"), []); print(next((i["title"] for i in its if d.date.fromisoformat(i["startDate"]) <= t < d.date.fromisoformat(i["startDate"]) + d.timedelta(days=i["duration"])), ""))' <<<"$iteration_json")"
          if [[ -n "$iteration_field_id" && -n "$current_iteration_id" ]]; then
            GH_TOKEN="$PROJECT_TOKEN" gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$iteration_field_id" --iteration-id "$current_iteration_id"
            echo "Synced $url -> $status, iteration: $current_iteration_title"
          else
            echo "::warning title=Iteration not assigned::Current iteration was not found; synced only status '$status'."
          fi
