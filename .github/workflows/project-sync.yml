name: Monolith Project Sync

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, synchronize, edited, converted_to_draft, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      item_url:
        description: Issue or Pull Request URL
        required: true
        type: string
      status:
        description: Project status
        required: true
        type: choice
        options: [Backlog, Ready, In progress, In review, Testing, Ready to merge, Done]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync-project:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.MONOLITH_PROJECT_TOKEN }}
      REPO_TOKEN: ${{ github.token }}
      PROJECT_OWNER: Amulet-software
      PROJECT_TITLE: Monolith Development
    steps:
      - uses: actions/checkout@v4
      - name: Sync Sprint and Project
        if: env.PROJECT_TOKEN != ''
        shell: bash
        run: bash .github/scripts/project-sync.sh
